  <!-- Release list schema -->
<script id="releases-schema" type="application/ld+json"></script>

<script type="module">
  import { releases } from "/content/releases.js";

  const baseUrl = "https://bellosoundsrecords.place";

  const itemListElement = releases.map((release, idx) => {
    const releaseUrl = release.pageUrl
      ? new URL(release.pageUrl, baseUrl).href
      : release.slug === "bsr011-extension"
        ? `${baseUrl}/extension.html`
        : `${baseUrl}/release.html?slug=${encodeURIComponent(release.slug)}`;

    return {
      "@type": "ListItem",
      "position": idx + 1,
      "item": {
        "@type": "MusicRelease",
        "@id": `${releaseUrl}#release`,
        "name": release.title,
        "catalogNumber": release.catalog,
        "url": releaseUrl,
        "image": `${baseUrl}${release.cover.replace("./", "/")}`,
        "description": release.descriptionShort || release.descriptionLong,
        "datePublished": release.releaseDate,
        "genre": ["House", "Deep House", "Soulful House"],
        "recordLabel": {
          "@id": "https://bellosoundsrecords.place/#label"
        },
        "creditedTo": release.artists.map(name => ({
          "@type": "MusicGroup",
          "@id": `${baseUrl}/artist.html?slug=${encodeURIComponent(release.alias)}#artist`,
          "name": name
        }))
      }
    };
  });

  const schema = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "BelloSounds Records – Full Release Catalog",
    "itemListElement": itemListElement
  };

  document.getElementById("releases-schema").textContent =
    JSON.stringify(schema, null, 2);
</script>
